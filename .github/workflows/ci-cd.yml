name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  NODE_VERSION: "20.19.0"
  GO_VERSION: "1.23.x"
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  frontend:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: front-app
            path: front/app
            artifact: front-app-dist
          - name: admin
            path: admin
            artifact: admin-dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.app.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.app.path }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.app.path }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app.path }}
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_WS_BASE_URL: ${{ secrets.VITE_WS_BASE_URL }}

      - name: Upload dist artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.artifact }}
          path: ${{ matrix.app.path }}/dist
          if-no-files-found: error

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - user
          - workspace
          - chat
          - task
          - complaint
          - gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/src/services/${{ matrix.service }}/go.sum

      - name: Test service
        run: go test ./...
        working-directory: server/src/services/${{ matrix.service }}

  docker-images:
    name: Build And Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            dockerfile: ./services/gateway/Dockerfile
            image: diploma-gateway
          - name: auth
            dockerfile: ./services/auth/Dockerfile
            image: diploma-auth
          - name: user
            dockerfile: ./services/user/Dockerfile
            image: diploma-user
          - name: workspace
            dockerfile: ./services/workspace/Dockerfile
            image: diploma-workspace
          - name: chat
            dockerfile: ./services/chat/Dockerfile
            image: diploma-chat
          - name: task
            dockerfile: ./services/task/Dockerfile
            image: diploma-task
          - name: complaint
            dockerfile: ./services/complaint/Dockerfile
            image: diploma-complaint
          - name: migrate
            dockerfile: ./cmd/migrate/Dockerfile
            image: diploma-migrate
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./server/src
          file: server/src/${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_NAMESPACE }}/${{ matrix.service.image }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_NAMESPACE }}/${{ matrix.service.image }}:main

  deploy:
    name: Deploy To Production
    runs-on: ubuntu-latest
    needs:
      - docker-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download app artifact
        uses: actions/download-artifact@v4
        with:
          name: front-app-dist
          path: deploy-assets/front-app-dist

      - name: Download admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: deploy-assets/admin-dist

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy,deploy-assets,server/src/docker-compose.yml,server/src/docker-compose.prod.yml,server/src/.env.example"
          target: "/opt/diploma"
          overwrite: true

      - name: Run deployment script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_NAMESPACE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            export IMAGE_TAG="${{ env.IMAGE_TAG }}"
            export DOCKERHUB_NAMESPACE="${{ secrets.DOCKERHUB_NAMESPACE }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            chmod +x /opt/diploma/deploy/deploy.sh
            /opt/diploma/deploy/deploy.sh
